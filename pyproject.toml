[project]
name = "querywarden-cli"
version = "0.1.0"
description = "A CI gate for text-to-SQL features on PostgreSQL: accuracy regressions and safety violations fail the build."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sofien Nefzi" }]
keywords = ["text-to-sql", "postgresql", "llm", "evaluation", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlglot>=25",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/NefziSofien/querywarden"

[project.scripts]
querywarden = "querywarden.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querywarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
