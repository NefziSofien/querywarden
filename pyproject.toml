[project]
name = "sqlgate"
version = "0.0.1"
description = "A CI gate for text-to-SQL features on PostgreSQL: accuracy regressions and safety violations fail the build."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlglot>=25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
